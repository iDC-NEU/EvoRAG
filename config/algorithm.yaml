server:
  ui_port: 8083
  ui_share: false

llm:
  zhipu:
    url: https://open.bigmodel.cn/api/paas/v4
    key: YOUR API-KEY

  moonshot:
    url: https://api.moonshot.cn/v1
    key: YOUR API-KEY

  baichuan:
    url: https://api.baichuan-ai.com/v1
    key: YOUR API-KEY

  qwen:
    url: https://dashscope.aliyuncs.com/compatible-mode/v1
    key: YOUR API-KEY

  lingyiwanwu:
    url: https://api.lingyiwanwu.com/v1
    key: YOUR API-KEY

  deepseek:
    url: https://api.deepseek.com
    key: YOUR API-KEY

  doubao:
    url: https://ark.cn-beijing.volces.com/api/v3
    key: YOUR API-KEY

  gpt:
    url: https://api.aigc798.com/v1/
    key: YOUR_API_KEY

  llama:
    url: http://localhost:11434/v1
    key: ollama

database:

  neo4j:
    url: bolt://localhost:7690
    username: neo4j
    password: "12345678"

  nebulagraph:
    url: 127.0.0.1:9669
    username: root
    password: "nebula"

organization: iDC-NE

embedding:
  name: "huggingface"
  model: "BAAI/bge-large-en-v1.5"
  dim: 1024
  device: "cuda:0"
  embed_batch_size: 1024
  num_workers: 4

shouldRebuildDatabase: false

score_min: 20
score_max: 200
iteration: 0
use_local_model: true
entity: 10
hop: 2
pruning: 10
algorithm: "leaderboardStrategy"
batch_size: 8

redundancy: false
feedback: true
rate: 0.0

relation_evolution:
  enabled: true
  max_hop: 2
  low_score_patience: 2
  soft_suppression: true
  low_score_decay: 1.0
  prune_low_score: false
  shortcut_relation_prefix: "shortcut"
  shortcut_label_mode: "llm"

llm_batch:
  graphrag_response: "llm_only"

evolve_basic:
  graphrag_response: "basic"
  extract_keywords: "basic"
  retrieve_path: "basic"
  simThreshold: 0.55
  score_weight: 0.5
  scoreThreshold: 70
  redundant_process: "basic_only_relationship_strict"
  feedback_process: "basic_for_triplet"
  top_k_per_entity: true
  lr : 5000000

evolve_standard:
  graphrag_response: "basic"
  extract_keywords: "basic"
  retrieve_path: "standard"
  simThreshold: 0
  scoreThreshold: -2
  score_weight: 0.5
  lr : 5000000
  redundant_process: "basic_only_relationship_strict"
  feedback_process: "standard_for_path"
  top_k_per_entity: true

evolve_shared_prefix:
  graphrag_response: "basic_shared_prefix"
  extract_keywords: "basic"
  retrieve_path: "standard"
  simThreshold: 0
  score_weight: 0.5
  scoreThreshold: -2
  redundant_process: "basic_only_relationship_strict"
  feedback_process: "standard_for_path_shared_prefix"
  top_k_per_entity: true
  lr : 0.5
  loss_epsilon: 1.0e-12

legacy_standard_batch:
  graphrag_response: "basic_shared_prefix"
  extract_keywords: "basic"
  retrieve_path: "standard"
  simThreshold: 0
  score_weight: 0.5
  scoreThreshold: -2
  redundant_process: "basic_only_relationship_strict"
  feedback_process: "standard_for_path_shared_prefix"
  top_k_per_entity: true
  lr : 0.5
  loss_epsilon: 1.0e-12

standard_batch:
  graphrag_response: "basic_shared_prefix"
  extract_keywords: "basic"
  retrieve_path: "standard"
  simThreshold: 0
  score_weight: 0.5
  scoreThreshold: -2
  redundant_process: "basic_only_relationship_strict"
  feedback_process: "continuous_for_path_shared_prefix"
  top_k_per_entity: true
  lr: 0.5
  loss_epsilon: 1.0e-12
  relation_evolution:
    enabled: true
    max_hop: 2
    soft_suppression: false
    prune_low_score: false
    shortcut_relation_prefix: "shortcut"
    shortcut_label_mode: "llm"

basic_batch:
  graphrag_response: "basic_shared_prefix"
  extract_keywords: "basic"
  retrieve_path: "basic"
  simThreshold: 0.55
  score_weight: 0.5
  scoreThreshold: 71
  redundant_process: "basic_only_relationship_strict"
  feedback_process: "basic_for_triplet_shared_prefix"
  top_k_per_entity: true
  lr : 5000000

leaderboardStrategy:
  graphrag_response: "basic_shared_prefix"
  extract_keywords: "basic"
  retrieve_path: "basic"
  simThreshold: 0.55
  score_weight: 0.5
  scoreThreshold: 71
  redundant_process: "basic_only_relationship_strict"
  feedback_process: "leaderboardStrategy"
  top_k_per_entity: true
  lr : 5000000

leaderboardStrategy_abaltion:
  graphrag_response: "basic_shared_prefix"
  extract_keywords: "basic"
  retrieve_path: "basic"
  simThreshold: 0.55
  score_weight: 0.5
  scoreThreshold: 71
  redundant_process: "basic_only_relationship_strict"
  feedback_process: "leaderboardStrategy_abaltion"
  top_k_per_entity: true
  lr : 5000000
